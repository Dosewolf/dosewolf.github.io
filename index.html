<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dosewolf</title>
  <meta name="description" content="Dosewolf is under development.">
  <style>
    :root {
      color-scheme: dark;
      --bg: #090a0c;
      --text: #f6f2ea;
      --muted: #a6a09a;
      --line: rgba(246, 242, 234, 0.14);
      --accent: #ef5a3c;
      --accent-soft: rgba(239, 90, 60, 0.18);
      --panel: rgba(255, 255, 255, 0.045);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      place-items: center;
      padding: 32px;
      background:
        radial-gradient(circle at 50% 0%, rgba(239, 90, 60, 0.18), transparent 34rem),
        linear-gradient(145deg, #090a0c 0%, #101114 48%, #17110f 100%);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }

    main {
      width: min(100%, 560px);
      padding: 40px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.34);
      backdrop-filter: blur(16px);
    }

    .mark {
      display: inline-grid;
      place-items: center;
      width: 52px;
      height: 52px;
      margin-bottom: 28px;
      border: 1px solid rgba(239, 90, 60, 0.36);
      border-radius: 8px;
      background: var(--accent-soft);
      color: var(--text);
      font-size: 18px;
      font-weight: 700;
    }

    h1 {
      margin: 0;
      font-size: clamp(40px, 10vw, 72px);
      line-height: 0.95;
      font-weight: 760;
    }

    p {
      max-width: 34rem;
      margin: 20px 0 0;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.55;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-top: 32px;
      padding: 10px 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--text);
      font-size: 14px;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 999px;
      background: var(--accent);
      box-shadow: 0 0 0 6px var(--accent-soft);
    }

    footer {
      margin-top: 48px;
      color: rgba(246, 242, 234, 0.42);
      font-size: 13px;
    }

    @media (max-width: 560px) {
      body {
        padding: 18px;
      }

      main {
        padding: 28px;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">DW</div>
    <h1>Dosewolf</h1>
    <p>We are rebuilding the site. A new experience is under development and will be live soon.</p>
    <div class="status"><span class="dot" aria-hidden="true"></span>Under development</div>
    <footer>Dosewolf Limited</footer>
  </main>
</body>
</html>
